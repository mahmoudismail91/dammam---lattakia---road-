name: Daily road update

on:
  schedule:
    - cron: "17 3 * * *"   # every day 03:17 UTC; GitHub Pages (deploy from branch) republishes after the commit
  workflow_dispatch:
    inputs:
      full:
        description: "Scan the whole route (not just today's chunks)"
        type: boolean
        default: false
      route:
        description: "Rebuild the road line from OSRM"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: road-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # plain git/python only (no marketplace actions), so it runs under any Actions policy
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          python3 --version
      - name: Scan OpenStreetMap along the road
        run: |
          ARGS=""
          if [ "${{ inputs.full }}" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ "${{ inputs.route }}" = "true" ]; then ARGS="$ARGS --route"; fi
          python3 scripts/update.py $ARGS
      - name: Collect road photos (Commons, Panoramax, KartaView, Mapillary)
        continue-on-error: true
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: python3 scripts/photos.py
      - name: Commit data
        run: |
          git config user.name "road-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Daily map update $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

